version: '3.1'

services:
  db:
    image: mysql:5.7.32
    ports:
    - "3306:3306"
    command: --default-authentication-plugin=mysql_native_password
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: devpassword123
    volumes:
    - codelabellerdata:/var/lib/mysql
  redis:
    image: redis:alpine
    restart: always
    command: redis-server --requirepass devredispass123
    ports:
    - 6379:6379
volumes:
  codelabellerdata:
